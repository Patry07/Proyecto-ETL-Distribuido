apiVersion: v1
kind: Pod
metadata:
  name: etl-lector
spec:
  restartPolicy: Never
  containers:
    - name: lector
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: resultados
          mountPath: /resultados
  volumes:
    - name: resultados
      persistentVolumeClaim:
        claimName: etl-resultados-pvc
